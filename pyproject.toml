[project]
name = "supply-chain-analytics"
version = "0.1.0"
description = "Various notebooks for supply chain analytics."
readme = "README.md"
authors = [
    { name = "Rajdeep Sandhu", email = "168480080+rajdeep-sandhu@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "duckdb>=2.0.0",
    "fastexcel>=0.21.0",
    "marimo[recommended, lsp]>=0.25.0",
    "matplotlib>=3.11.1",
    "panel>=1.9.3",
]

[project.scripts]
supply-chain-analytics = "supply_chain_analytics:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]


[tool.marimo.completion]
signature_hint_on_typing = true

[tool.marimo.package_management]
manager = "uv"

[tool.marimo.display]
default_width = "full"

[tool.marimo.save]
format_on_save = true

[tool.marimo.runtime]
auto_instantiate = true
auto_reload = "autorun"